[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers for page routes live in next.config.ts's headers() function, not here —
# Netlify's own custom-headers feature only applies to files served straight from its static
# backing store, not to pages routed through the Next.js runtime's functions/edge functions.
# See the comment in next.config.ts for details.
